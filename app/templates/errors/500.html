<!-- app/templates/errors/500.html -->
{% extends "base.html" %}
{% block title %}Server Error{% endblock %}

{% block additional_css %}
<style>
    .error-container {
        padding: 5rem 0;
        text-align: center;
    }
    
    .error-code {
        font-size: 8rem;
        font-weight: bold;
        color: var(--primary);
        margin-bottom: 1rem;
        line-height: 1;
    }
    
    .error-message {
        font-size: 2rem;
        margin-bottom: 2rem;
        color: var(--dark);
    }
    
    .error-description {
        font-size: 1.2rem;
        color: var(--gray);
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 3rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container text-center mt-5">
    <div class="error-container">
        <h1 class="error-code">500</h1>
        <h2 class="error-message">Server Error</h2>
        <p class="error-description">Oops! Something went wrong on our end. Please try again later, or contact support if the problem persists.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">
                <i class="fas fa-home me-2"></i>Return to Homepage
            </a>
            <button onclick="window.location.reload()" class="btn btn-outline-primary btn-lg">
                <i class="fas fa-sync-alt me-2"></i>Refresh Page
            </button>
        </div>
    </div>
</div>
{% endblock %}
