<!-- app/templates/errors/404.html -->
{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block additional_css %}
<style>
    .error-container {
        padding: 5rem 0;
        text-align: center;
    }
    
    .error-code {
        font-size: 8rem;
        font-weight: bold;
        color: var(--primary);
        margin-bottom: 1rem;
        line-height: 1;
    }
    
    .error-message {
        font-size: 2rem;
        margin-bottom: 2rem;
        color: var(--dark);
    }
    
    .error-description {
        font-size: 1.2rem;
        color: var(--gray);
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 3rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container text-center mt-5">
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Page Not Found</h2>
        <p class="error-description">The page you're looking for doesn't exist or has been moved. Please check the URL or return to the homepage.</p>
        <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i>Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
